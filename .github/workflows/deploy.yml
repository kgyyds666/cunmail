name: Deploy to Cloudflare

on:
  workflow_dispatch:

jobs:
  check_credentials:
    runs-on: ubuntu-latest
    name: Check for Cloudflare Credentials

    outputs:
      has_creds: ${{ steps.cf_creds.outputs.has_creds }}

    steps:
      - name: Check for Cloudflare credentials
        id: cf_creds
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials not found, skipping deployment."
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare credentials found."
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: check_credentials
    if: needs.check_credentials.outputs.has_creds == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm run build

      # 配置 Wrangler
      - name: Configure Wrangler
        run: |
          python3 <<'PY'
          import os
          import re
          import sys

          path = "wrangler.toml"

          with open(path, "r", encoding="utf-8") as f:
              config = f.read()

          # 必需变量检查
          required_vars = [
              "D1_DATABASE_ID",
              "D1_DATABASE_NAME",
          ]

          for key in required_vars:
              if not os.environ.get(key, "").strip():
                  sys.exit(f"Error: {key} is required")

          # TOML 字符串转义
          def toml_escape(value):
              return (
                  value
                  .replace("\\", "\\\\")
                  .replace('"', '\\"')
                  .replace("\n", "\\n")
                  .replace("\r", "\\r")
                  .replace("\t", "\\t")
              )

          # ===== 邮箱域名自动规范化 =====
          raw_domains = os.environ.get("EMAIL_DOMAIN", "")

          # 支持换行、空格、逗号、分号分隔
          domains = re.split(r"[\s,;]+", raw_domains.strip())

          cleaned_domains = []

          for domain in domains:
              domain = domain.strip().lstrip("@").lower()

              if not domain:
                  continue

              # 域名格式验证
              if not re.fullmatch(
                  r"(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}",
                  domain
              ):
                  sys.exit(f"Invalid email domain: {domain}")

              if domain not in cleaned_domains:
                  cleaned_domains.append(domain)

          if not cleaned_domains:
              sys.exit("Error: EMAIL_DOMAIN contains no valid domains")

          # 转换为项目所需的逗号分隔格式
          email_domain = ",".join(cleaned_domains)

          print(f"Validated {len(cleaned_domains)} email domains.")

          config = config.replace(
              "${EMAIL_DOMAIN}",
              toml_escape(email_domain)
          )

          # ===== 普通字符串变量替换 =====
          string_vars = [
              "D1_DATABASE_ID",
              "D1_DATABASE_NAME",
              "COOKIES_SECRET",
              "TURNSTILE_KEY",
              "TURNSTILE_SECRET",
              "MAILBOX_TOKEN_SECRET",
              "SENDER_EMAIL",
          ]

          for key in string_vars:
              value = os.environ.get(key, "")

              config = config.replace(
                  "${" + key + "}",
                  toml_escape(value)
              )

          # ===== 邮件渠道配置 =====
          send_channel = os.environ.get(
              "SEND_CHANNEL", ""
          ).strip().lower()

          if send_channel:

              if send_channel == "resend":
                  if not os.environ.get("RESEND_API_KEY"):
                      sys.exit("Error: RESEND_API_KEY is required")

              elif send_channel == "mailchannels":
                  if not os.environ.get("MAILCHANNELS_API_KEY"):
                      sys.exit("Error: MAILCHANNELS_API_KEY is required")

              elif send_channel == "cloudflare":
                  pass

              elif send_channel == "send_email":
                  print(
                      "::warning::SEND_CHANNEL=send_email is deprecated; "
                      "using cloudflare instead."
                  )
                  send_channel = "cloudflare"

              else:
                  sys.exit(f"Unsupported SEND_CHANNEL: {send_channel}")

              if not os.environ.get("SENDER_EMAIL"):
                  sys.exit("Error: SENDER_EMAIL is required")

              if not os.environ.get("MAILBOX_TOKEN_SECRET"):
                  sys.exit("Error: MAILBOX_TOKEN_SECRET is required")

              config = config.replace(
                  "${SEND_CHANNEL}",
                  send_channel
              )

          else:
              # 未启用邮件时删除相关配置
              for key in [
                  "SEND_CHANNEL",
                  "SENDER_EMAIL",
                  "MAILBOX_TOKEN_SECRET",
              ]:
                  config = re.sub(
                      rf"(?m)^[ \t]*{key}[ \t]*=.*\n?",
                      "",
                      config
                  )

          # ===== 可选字符串配置 =====
          optional_string_vars = [
              "PASSWORD",
              "SHOW_AFF",
          ]

          for key in optional_string_vars:
              value = os.environ.get(key, "")

              if value:
                  config = config.replace(
                      "${" + key + "}",
                      toml_escape(value)
                  )
              else:
                  config = re.sub(
                      rf"(?m)^[ \t]*{key}[ \t]*=.*\n?",
                      "",
                      config
                  )

          # ===== 可选数字配置 =====
          numeric_vars = [
              "API_RATE_LIMIT_PER_MINUTE",
              "SEND_RATE_LIMIT_PER_MINUTE",
              "SEND_IP_RATE_LIMIT_PER_MINUTE",
          ]

          for key in numeric_vars:
              value = os.environ.get(key, "").strip()

              if value:
                  if not value.isdigit():
                      sys.exit(f"Error: {key} must be numeric")

                  config = config.replace(
                      "${" + key + "}",
                      value
                  )
              else:
                  config = re.sub(
                      rf"(?m)^[ \t]*{key}[ \t]*=.*\n?",
                      "",
                      config
                  )

          # ===== OpenAPI 开关 =====
          enable_openapi = (
              os.environ.get("ENABLE_OPENAPI", "")
              .strip()
              .lower() == "true"
          )

          config = re.sub(
              r"(?m)^ENABLE_OPENAPI\s*=.*$",
              f'ENABLE_OPENAPI = "{str(enable_openapi).lower()}"',
              config
          )

          # ===== 检查未替换的占位符 =====
          leftovers = re.findall(
              r"\$\{[A-Z0-9_]+\}",
              config
          )

          if leftovers:
              sys.exit(
                  "Error: Unresolved placeholders: "
                  + ", ".join(sorted(set(leftovers)))
              )

          # 写入 wrangler.toml
          with open(path, "w", encoding="utf-8") as f:
              f.write(config)

          print("Wrangler configuration generated successfully.")
          PY
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          EMAIL_DOMAIN: ${{ secrets.EMAIL_DOMAIN }}
          COOKIES_SECRET: ${{ secrets.COOKIES_SECRET }}
          TURNSTILE_KEY: ${{ secrets.TURNSTILE_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_RATE_LIMIT_PER_MINUTE: ${{ secrets.API_RATE_LIMIT_PER_MINUTE }}
          SHOW_AFF: ${{ secrets.SHOW_AFF }}
          ENABLE_OPENAPI: ${{ secrets.ENABLE_OPENAPI }}
          SEND_CHANNEL: ${{ secrets.SEND_CHANNEL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SEND_RATE_LIMIT_PER_MINUTE: ${{ secrets.SEND_RATE_LIMIT_PER_MINUTE }}
          SEND_IP_RATE_LIMIT_PER_MINUTE: ${{ secrets.SEND_IP_RATE_LIMIT_PER_MINUTE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAILCHANNELS_API_KEY: ${{ secrets.MAILCHANNELS_API_KEY }}
          MAILBOX_TOKEN_SECRET: ${{ secrets.MAILBOX_TOKEN_SECRET }}

      # 应用 D1 数据库迁移
      - name: Apply D1 Migrations
        run: |
          npx wrangler@4.111.0 d1 migrations apply "$D1_DATABASE_NAME" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}

      # 部署 Cloudflare Workers
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.111.0"

      # 配置邮件发送密钥
      - name: Configure sender secrets
        run: |
          if [ -z "$SEND_CHANNEL" ]; then
            echo "SEND_CHANNEL is empty, skipping secrets"
            exit 0
          fi

          echo "Configuring sender secrets..."

          if [ -n "$RESEND_API_KEY" ]; then
            echo "Setting RESEND_API_KEY..."
            printf '%s' "$RESEND_API_KEY" \
              | npx wrangler@4.111.0 secret put RESEND_API_KEY
          fi

          if [ -n "$MAILCHANNELS_API_KEY" ]; then
            echo "Setting MAILCHANNELS_API_KEY..."
            printf '%s' "$MAILCHANNELS_API_KEY" \
              | npx wrangler@4.111.0 secret put MAILCHANNELS_API_KEY
          fi

          echo "Secrets configured successfully."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SEND_CHANNEL: ${{ secrets.SEND_CHANNEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAILCHANNELS_API_KEY: ${{ secrets.MAILCHANNELS_API_KEY }}
